<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coder-Agent 客户端</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0f12; color: #e6e6e6; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; overflow: hidden; }

  /* ── 侧边栏 ── */
  aside { width: 240px; background: #111418; border-right: 1px solid #1e2329; display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 12px 14px; border-bottom: 1px solid #1e2329; display: flex; align-items: center; justify-content: space-between; }
  .sidebar-header h1 { font-size: 14px; color: #4fc3f7; font-weight: 600; letter-spacing: 0.5px; }
  .sidebar-tabs { display: flex; gap: 4px; padding: 10px 14px 6px; }
  .sidebar-tab { flex: 1; padding: 6px; font-size: 12px; background: #1a1f26; border: 1px solid #1e2329; border-radius: 6px; color: #8e9aa8; cursor: pointer; text-align: center; transition: all 0.15s; }
  .sidebar-tab.active { background: #1e3a5f; border-color: #4fc3f7; color: #4fc3f7; }
  .sidebar-tab:hover:not(.active) { border-color: #2a2e36; color: #cfcfcf; }
  .sidebar-content { flex: 1; overflow-y: auto; padding: 8px 14px; }
  .sidebar-content::-webkit-scrollbar { width: 4px; }
  .sidebar-content::-webkit-scrollbar-thumb { background: #2a2e36; border-radius: 2px; }
  .session-item { padding: 8px 10px; font-size: 11px; background: #1a1f26; border: 1px solid #1e2329; border-radius: 6px; color: #8e9aa8; cursor: pointer; margin-bottom: 4px; transition: all 0.15s; word-break: break-all; line-height: 1.4; }
  .session-item:hover, .session-item.active { border-color: #4fc3f7; color: #cfcfcf; }
  .session-item .session-time { font-size: 10px; color: #3d444d; margin-top: 2px; }
  .session-item .session-meta { font-size: 10px; color: #3d444d; margin-top: 2px; display: flex; gap: 8px; }
  .refresh-btn { width: 100%; padding: 8px; font-size: 11px; background: transparent; border: 1px dashed #2a2e36; border-radius: 6px; color: #555e6a; cursor: pointer; margin-top: 8px; transition: all 0.15s; }
  .refresh-btn:hover { border-color: #4fc3f7; color: #4fc3f7; }
  .file-item { padding: 6px 10px; font-size: 11px; background: #1a1f26; border: 1px solid #1e2329; border-radius: 4px; color: #8e9aa8; cursor: pointer; margin-bottom: 2px; transition: all 0.15s; }
  .file-item:hover { border-color: #4fc3f7; color: #cfcfcf; }
  .folder-item { padding: 6px 10px; font-size: 11px; background: #1a1f26; border: 1px solid #1e2329; border-radius: 4px; color: #4fc3f7; cursor: pointer; margin-bottom: 2px; transition: all 0.15s; }
  .folder-item:hover { border-color: #4fc3f7; background: #1e2a36; }

  /* ── 主区域 ── */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #0d0f12; }

  /* ── 头部 ── */
  header { padding: 10px 16px; border-bottom: 1px solid #1e2329; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: #111418; }
  .header-group { display: flex; gap: 8px; align-items: center; position: relative; }
  .header-label { font-size: 12px; color: #555e6a; }
  select, input[type=text], input[type=password] { background: #1a1f26; color: #e6e6e6; border: 1px solid #1e2329; border-radius: 6px; padding: 5px 10px; font-size: 12px; outline: none; transition: border-color 0.15s; }
  select:focus, input[type=text]:focus, input[type=password]:focus { border-color: #4fc3f7; }
  .header-btn { background: #1a1f26; color: #8e9aa8; border: 1px solid #1e2329; border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .header-btn:hover { border-color: #4fc3f7; color: #4fc3f7; }
  .status-indicator { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #555e6a; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #555e6a; transition: background 0.3s; }
  .status-dot.running { background: #4fc3f7; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .workspace-path { font-size: 11px; color: #555e6a; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── 对话流 ── */
  #feed { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #feed::-webkit-scrollbar { width: 6px; }
  #feed::-webkit-scrollbar-thumb { background: #1e2329; border-radius: 3px; }

  .message { max-width: 85%; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .user { align-self: flex-end; background: #1e3a5f; border-radius: 12px 12px 2px 12px; padding: 10px 14px; font-size: 13px; line-height: 1.5; }
  .answer { align-self: flex-start; background: #16321f; border: 1px solid #2e7d32; border-radius: 12px 12px 12px 2px; padding: 12px 16px; font-size: 13px; line-height: 1.6; }
  .think { color: #8e9aa8; font-size: 12px; white-space: pre-wrap; border-left: 2px solid #1e2329; padding-left: 10px; margin: 4px 0; }
  .turn { align-self: center; color: #3d444d; font-size: 11px; padding: 4px 12px; }
  .error { align-self: flex-start; background: #2d1f1f; color: #ef9a9a; border-radius: 8px; padding: 10px 14px; font-size: 12px; }

  /* ── Turn 分组容器（可展开）── */
  .turn-block { align-self: stretch; border: 1px solid #1e2329; border-radius: 10px; overflow: hidden; background: #111418; margin: 2px 0; }
  .turn-block summary { padding: 8px 14px; cursor: pointer; font-size: 12px; color: #8e9aa8; list-style: none; display: flex; align-items: center; gap: 8px; user-select: none; }
  .turn-block summary:hover { background: #161a1f; }
  .turn-block summary::before { content: "▸"; color: #3d444d; transition: transform 0.15s; }
  .turn-block[open] summary::before { transform: rotate(90deg); }
  .turn-block .turn-badge { font-family: Consolas, monospace; color: #4fc3f7; }
  .turn-block .turn-count { color: #555e6a; font-size: 11px; margin-left: auto; }
  .turn-block .turn-body { padding: 6px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .turn-block .turn-user { align-self: flex-end; background: #1e3a5f; border-radius: 10px 10px 2px 10px; padding: 8px 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; max-width: 85%; }
  .turn-block .turn-answer { align-self: flex-start; background: #16321f; border: 1px solid #2e7d32; border-radius: 10px 10px 10px 2px; padding: 10px 14px; font-size: 13px; line-height: 1.6; max-width: 85%; }
  .turn-block .turn-answer.empty { display: none; }

  details.tool-details { align-self: stretch; border: 1px solid #1e2329; border-radius: 8px; overflow: hidden; background: #0d0f12; }
  details.tool-details summary { padding: 7px 12px; cursor: pointer; font-size: 12px; font-family: Consolas, monospace; color: #8e9aa8; list-style: none; display: flex; align-items: center; gap: 8px; background: #14171c; }
  details.tool-details summary:hover { background: #1a1f26; }
  details.tool-details summary::before { content: "▸"; color: #3d444d; }
  details.tool-details[open] summary::before { transform: rotate(90deg); }
  details.tool-details .ok { color: #66bb6a; }
  details.tool-details .fail { color: #ef5350; }
  details.tool-details .tool-name { color: #4fc3f7; }
  details.tool-details .tool-target { color: #8e9aa8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }
  details.tool-details .body { padding: 10px 12px; font-family: Consolas, monospace; font-size: 11px; color: #c8e1ff; max-height: 240px; overflow: auto; white-space: pre-wrap; line-height: 1.5; }
  details.tool-details .body::-webkit-scrollbar { width: 4px; }
  details.tool-details .body::-webkit-scrollbar-thumb { background: #1e2329; border-radius: 2px; }
  details.tool-details .body .arg-label { color: #4fc3f7; margin: 6px 0 2px; font-weight: bold; }
  details.tool-details .body .res-label { color: #66bb6a; margin: 8px 0 2px; font-weight: bold; }
  details.tool-details .body .err-label { color: #ef5350; margin: 8px 0 2px; font-weight: bold; }

  /* ── 历史会话视图工具栏 ── */
  #historyBar { display: none; padding: 8px 16px; border-bottom: 1px solid #1e2329; background: #111418; font-size: 12px; color: #8e9aa8; align-items: center; gap: 10px; }
  #historyBar .back-btn { background: none; border: 1px solid #2a2e36; color: #8e9aa8; border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
  #historyBar .back-btn:hover { border-color: #4fc3f7; color: #4fc3f7; }
  #historyBar .hist-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Markdown 渲染 ── */
  .md h1, .md h2, .md h3 { margin: 12px 0 8px; color: #e6e6e6; font-weight: 600; }
  .md h1 { font-size: 18px; }
  .md h2 { font-size: 16px; }
  .md h3 { font-size: 14px; }
  .md p { margin: 8px 0; line-height: 1.6; }
  .md pre { background: #0d0f12; border: 1px solid #1e2329; border-radius: 8px; padding: 12px; overflow-x: auto; margin: 10px 0; position: relative; }
  .md pre code { font-family: Consolas, monospace; font-size: 12px; color: #c8e1ff; }
  .md code.inline { background: #1a1f26; border-radius: 4px; padding: 2px 6px; font-family: Consolas, monospace; color: #c8e1ff; font-size: 12px; }
  .md ul, .md ol { margin: 8px 0 8px 20px; }
  .md li { margin: 4px 0; line-height: 1.5; }
  .copy-btn { position: absolute; top: 8px; right: 8px; background: #1a1f26; color: #555e6a; border: 1px solid #1e2329; border-radius: 4px; font-size: 10px; padding: 3px 8px; cursor: pointer; transition: all 0.15s; }
  .copy-btn:hover { color: #4fc3f7; border-color: #4fc3f7; }

  /* ── 底部栏 ── */
  #footer { padding: 8px 16px; border-top: 1px solid #1e2329; font-size: 11px; color: #3d444d; display: flex; gap: 16px; background: #111418; }
  .footer-stat { display: flex; align-items: center; gap: 4px; }
  .footer-stat span { color: #555e6a; }

  /* ── 斜杠命令面板 ── */
  #palette { display: none; position: absolute; bottom: 70px; left: 16px; right: 16px; background: #111418; border: 1px solid #1e2329; border-radius: 10px; max-height: 280px; overflow-y: auto; z-index: 40; box-shadow: 0 -4px 24px rgba(0,0,0,.5); }
  #palette .group-label { padding: 8px 14px 2px; font-size: 10px; color: #3d444d; letter-spacing: 1px; text-transform: uppercase; }
  #palette .item { padding: 10px 14px; cursor: pointer; display: flex; gap: 12px; align-items: center; transition: background 0.15s; }
  #palette .item:hover, #palette .item.active { background: #1a1f26; }
  #palette .item .name { color: #4fc3f7; font-family: Consolas, monospace; font-size: 12px; min-width: 120px; }
  #palette .item .desc { color: #8e9aa8; font-size: 11px; }
  #palette .item .kbd { color: #3d444d; font-size: 10px; margin-left: auto; border: 1px solid #2a2e36; border-radius: 3px; padding: 1px 5px; }
  #palette .empty { padding: 12px 14px; color: #3d444d; font-size: 12px; }
  #paramHint { display: none; font-size: 11px; color: #4fc3f7; padding: 2px 4px; }

  /* ── 输入框 ── */
  form { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid #1e2329; background: #111418; flex-direction: column; }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; background: #1a1f26; color: #e6e6e6; border: 1px solid #1e2329; border-radius: 8px; padding: 10px 14px; font-family: inherit; font-size: 13px; line-height: 1.5; resize: none; overflow: hidden; max-height: 160px; transition: border-color 0.15s; }
  textarea:focus { outline: none; border-color: #4fc3f7; }
  textarea::placeholder { color: #3d444d; }
  .input-hint { font-size: 11px; color: #3d444d; padding: 4px 0; }
  button.primary { background: #1e88e5; color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  button.primary:hover { background: #1976d2; }
  button.primary:disabled { background: #1a1f26; color: #3d444d; cursor: not-allowed; }
  button.stop { background: #c62828; color: white; border: none; border-radius: 8px; padding: 10px 16px; font-size: 13px; cursor: pointer; transition: all 0.15s; display: none; }
  button.stop:hover { background: #b71c1c; }

  /* ── 模态框 ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 50; backdrop-filter: blur(4px); }
  .modal-overlay.show { display: block; }
  .modal-content { background: #111418; border: 1px solid #1e2329; border-radius: 12px; margin: 60px auto; padding: 20px; max-width: 600px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header b { font-size: 14px; color: #e6e6e6; }
  .modal-close { background: none; color: #555e6a; border: none; cursor: pointer; font-size: 18px; padding: 4px; }
  .modal-close:hover { color: #e6e6e6; }
  .config-row { margin-bottom: 14px; }
  .config-row label { display: block; font-size: 12px; color: #8e9aa8; margin-bottom: 6px; }
  .config-row input, .config-row select { width: 100%; padding: 8px 12px; }
  .config-hint { font-size: 11px; color: #3d444d; margin-top: 4px; }
  #fileBody { flex: 1; overflow: auto; background: #0d0f12; border-radius: 8px; padding: 14px; font-family: Consolas, monospace; font-size: 12px; color: #c8e1ff; white-space: pre-wrap; line-height: 1.5; }
  #fileBody::-webkit-scrollbar { width: 6px; }
  #fileBody::-webkit-scrollbar-thumb { background: #1e2329; border-radius: 3px; }
  #dirList { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  #dirList::-webkit-scrollbar { width: 4px; }
  #dirList::-webkit-scrollbar-thumb { background: #1e2329; border-radius: 2px; }
  #modelDropdown { display: none; position: absolute; top: 100%; left: 0; margin-top: 4px; background: #111418; border: 1px solid #1e2329; border-radius: 8px; max-height: 200px; overflow-y: auto; z-index: 30; min-width: 220px; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  #modelDropdown .model-item { padding: 8px 12px; font-size: 12px; cursor: pointer; color: #8e9aa8; transition: background 0.15s; }
  #modelDropdown .model-item:hover { background: #1a1f26; color: #4fc3f7; }
  #modelDropdown .model-item.selected { color: #4fc3f7; font-weight: 600; }
  .input-wrapper { position: relative; }
</style>
</head>
<body>
<aside>
  <div class="sidebar-header">
    <h1>📋 Coder-Agent</h1>
  </div>
  <div class="sidebar-tabs">
    <button class="sidebar-tab active" id="tab-sessions" onclick="showTab('sessions')">会话</button>
    <button class="sidebar-tab" id="tab-files" onclick="showTab('files')">文件</button>
  </div>
  <div class="sidebar-content" id="pane-sessions">
    <div style="font-size:11px; color:#3d444d; margin-bottom:8px;">历史会话（点击查看详情）</div>
    <div id="sessions"></div>
    <button class="refresh-btn" onclick="loadSessions()">↻ 刷新</button>
  </div>
  <div class="sidebar-content" id="pane-files" style="display:none;">
    <button class="refresh-btn" onclick="loadFiles()">↻ 刷新文件树</button>
    <div id="filetree" style="margin-top:8px;"></div>
  </div>
</aside>

<main>
  <header>
    <div class="header-group">
      <span class="header-label">模式</span>
      <select id="mode">
        <option value="full">full</option>
        <option value="goal">goal</option>
        <option value="plan">plan</option>
        <option value="dry-run">dry-run</option>
      </select>
    </div>
    <div class="header-group input-wrapper">
      <span class="header-label">模型</span>
      <input type="text" id="model" style="width:150px;" placeholder="选择模型..." readonly>
      <div id="modelDropdown"></div>
    </div>
    <button class="header-btn" onclick="openConfigModal()">⚙ 设置</button>
    <button class="header-btn" onclick="openFolderDialog()">📂 打开文件夹</button>
    <div class="status-indicator">
      <div class="status-dot" id="statusDot"></div>
      <span id="state">空闲</span>
    </div>
    <span class="workspace-path" id="ws"></span>
  </header>

  <div id="historyBar">
    <button class="back-btn" onclick="closeHistory()">← 返回实时</button>
    <span class="hist-title" id="histTitle"></span>
  </div>
  <div id="feed"></div>
  <div id="palette"></div>

  <div id="footer">
    <div class="footer-stat"><span>tokens:</span><span id="f-tokens">0</span></div>
    <div class="footer-stat"><span>steps:</span><span id="f-steps">0</span></div>
    <div class="footer-stat"><span>mode:</span><span id="f-mode">full</span></div>
    <span style="margin-left:auto;">© Coder-Agent（自研，零框架）</span>
  </div>

  <form id="form" onsubmit="return false;">
    <div id="paramHint"></div>
    <div class="input-row">
      <textarea id="task" rows="1" placeholder="输入编程任务… Enter 发送 / Shift+Enter 换行 / 输入 / 呼出命令面板" autocomplete="off"></textarea>
      <button type="button" class="primary" id="send" onclick="handleSubmit()">运行</button>
      <button type="button" class="stop" id="stop" onclick="abort()">■ 停止</button>
    </div>
    <div class="input-hint" id="inputHint">⏎ 发送 · Shift+⏎ 换行 · / 命令面板 · ↑↓ 选择 · Tab 补全 · Esc 关闭</div>
  </form>
</main>

<!-- 设置模态框：模型 / API 配置 -->
<div id="configModal" class="modal-overlay" onclick="if(event.target===this)closeConfigModal()">
  <div class="modal-content" style="max-width:460px;">
    <div class="modal-header">
      <b>⚙ 模型与 API 配置</b>
      <button class="modal-close" onclick="closeConfigModal()">✕</button>
    </div>
    <div class="config-row">
      <label>模型</label>
      <select id="cfg-model"></select>
      <div class="config-hint">从在线模型列表加载；也可手动输入</div>
    </div>
    <div class="config-row">
      <label>API Base URL</label>
      <input type="text" id="cfg-baseurl" placeholder="https://api.agnes-ai.cn/v1">
      <div class="config-hint">OpenAI 兼容接口地址</div>
    </div>
    <div class="config-row">
      <label>API Key</label>
      <input type="password" id="cfg-apikey" placeholder="sk-...">
      <div class="config-hint" id="cfg-keyhint"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:18px;justify-content:flex-end;">
      <button class="header-btn" onclick="closeConfigModal()">取消</button>
      <button class="primary" onclick="saveConfig()">保存配置</button>
    </div>
  </div>
</div>

<!-- 文件夹选择器 -->
<div id="folderModal" class="modal-overlay" onclick="if(event.target===this)closeFolderDialog()">
  <div class="modal-content">
    <div class="modal-header">
      <b>选择工作区文件夹</b>
      <button class="modal-close" onclick="closeFolderDialog()">✕</button>
    </div>
    <div id="crumb" style="font-size:12px;color:#4fc3f7;margin-bottom:12px;word-break:break-all;"></div>
    <div id="dirList"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="primary" onclick="chooseFolder()">选择当前目录</button>
      <button class="header-btn" onclick="upFolder()">上一级</button>
    </div>
  </div>
</div>

<!-- 文件查看器 -->
<div id="fileModal" class="modal-overlay" onclick="if(event.target===this)closeFileViewer()">
  <div class="modal-content" style="width:90%;height:80%;margin:40px auto;display:flex;flex-direction:column;">
    <div class="modal-header">
      <b id="fileTitle" style="word-break:break-all;"></b>
      <button class="modal-close" onclick="closeFileViewer()">✕</button>
    </div>
    <pre id="fileBody"></pre>
  </div>
</div>

<script>
/* ── 状态管理（集中化）── */
const AppState = {
  running: false,
  sessionGoal: localStorage.getItem('coder_goal') || '',
  commands: [],
  models: [],
  es: null,          // EventSource 实例
  currentTurnEl: null,  // 当前实时 turn 容器
  viewingHistory: false, // 是否正在查看历史会话
  currentSessionFile: null,
};

/* ── DOM 引用 ── */
const feed = document.getElementById("feed");
const inputEl = document.getElementById("task");
const paletteEl = document.getElementById("palette");

/* ── 工具函数 ── */
function escHtml(s) { return s ? String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ""; }
function nearBottom() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 100; }
function scrollFeed(force) { if (force || nearBottom()) feed.scrollTop = feed.scrollHeight; }
function add(cls, text) {
  const stick = nearBottom();
  const div = document.createElement("div");
  div.className = "message " + cls;
  div.textContent = text;
  feed.appendChild(div);
  scrollFeed(stick || cls === "user");
  return div;
}
function parseArgs(argsStr) {
  try {
    const o = JSON.parse(argsStr || "{}");
    return Object.entries(o).map(([k, v]) => {
      let vs = typeof v === "object" ? JSON.stringify(v) : String(v);
      if (vs.length > 300) vs = vs.slice(0, 300) + "…";
      return k + ": " + vs;
    }).join("\n");
  } catch (e) {
    return argsStr;
  }
}

/* ── Mini-Markdown 渲染 ── */
function renderMarkdown(md) {
  if (!md) return document.createElement("div");
  const blocks = md.split(/\n```/);
  let html = "";
  const codeStore = [];
  blocks.forEach((blk, bi) => {
    if (bi % 2 === 1) {
      const nl = blk.indexOf("\n");
      const body = nl >= 0 ? blk.slice(nl + 1) : blk;
      const id = "code_" + codeStore.length;
      codeStore.push(body.replace(/\n$/, ""));
      html += '<pre><code>' + escHtml(body.replace(/\n$/, "")) +
              '</code><button class="copy-btn" data-code="' + id + '">复制</button></pre>';
      return;
    }
    let seg = escHtml(blk);
    seg = seg.replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>');
    seg = seg.replace(/^###\s?(.+)$/gm, "<h3>$1</h3>");
    seg = seg.replace(/^##\s?(.+)$/gm, "<h2>$1</h2>");
    seg = seg.replace(/^#\s?(.+)$/gm, "<h1>$1</h1>");
    seg = seg.replace(/^\s?[-*]\s+(.+)$/gm, "<li>$1</li>");
    seg = seg.replace(/^(\d+)\.\s+(.+)$/gm, "<li>$2</li>");
    seg = seg.replace(/(<li>.*?<\/li>)/gs, (m) => m.includes("</ul>") || m.includes("</ol>") ? m : "<ul>" + m + "</ul>");
    seg = seg.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    html += "<div class='md'>" + seg + "</div>";
  });
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  wrap.querySelectorAll(".copy-btn").forEach(btn => {
    btn.onclick = () => {
      const code = codeStore[+btn.dataset.code.slice(5)] || "";
      navigator.clipboard.writeText(code);
      btn.textContent = "已复制";
      setTimeout(() => btn.textContent = "复制", 1200);
    };
  });
  return wrap;
}

/* ── Turn 容器（实时流按 turn 分组）── */
function beginTurn(step) {
  const det = document.createElement("details");
  det.className = "turn-block";
  det.open = true;
  det.innerHTML = "<summary><span class='turn-badge'>Turn " + step + "</span>" +
    "<span class='turn-count' id='turn-count-" + step + "'>0 步</span></summary>" +
    '<div class="turn-body"></div>';
  // 关闭上一个 turn（保持紧凑）
  if (AppState.currentTurnEl) {
    AppState.currentTurnEl.open = false;
  }
  feed.appendChild(det);
  AppState.currentTurnEl = det;
  scrollFeed(true);
  return det.querySelector(".turn-body");
}

function appendToolToTurn(ev) {
  if (!AppState.currentTurnEl) beginTurn(ev.step || 1);
  const body = AppState.currentTurnEl.querySelector(".turn-body");
  const det = document.createElement("details");
  det.className = "tool-details";
  const mark = ev.success ? '<span class="ok">✓</span>' : '<span class="fail">✗</span>';
  det.innerHTML = "<summary>" + mark +
    " <span class='tool-name'>" + escHtml(ev.tool) + "</span>" +
    (ev.target ? " <span class='tool-target'>→ " + escHtml(ev.target) + "</span>" : "") +
    "</summary>" +
    '<div class="body">' +
    (ev.detail ? "<span class='err-label'>error</span>\n" + escHtml(ev.detail) + "\n" : "") +
    (ev.preview || "(无输出)") +
    "</div>";
  body.appendChild(det);
  // 更新 turn 计数
  const cnt = AppState.currentTurnEl.querySelector(".turn-count");
  const n = body.querySelectorAll("details.tool-details").length;
  cnt.textContent = n + " 步";
  scrollFeed(nearBottom());
}

/* ── SSE 事件渲染 ── */
function onEvent(ev) {
  if (ev.kind === "text") {
    const t = (ev.text || "").trim();
    if (!t) return;
    if (!AppState.currentTurnEl) beginTurn(ev.step || 1);
    const body = AppState.currentTurnEl.querySelector(".turn-body");
    const div = document.createElement("div");
    div.className = "think";
    div.textContent = "│ " + (t.length > 600 ? t.slice(0, 600) + "…" : t);
    body.appendChild(div);
    scrollFeed(nearBottom());
  } else if (ev.kind === "tool") {
    appendToolToTurn(ev);
  } else if (ev.kind === "turn") {
    beginTurn(ev.step);
    document.getElementById("f-tokens").textContent = ev.tokens || 0;
    document.getElementById("f-steps").textContent = ev.step;
  } else if (ev.kind === "answer") {
    if (AppState.currentTurnEl) {
      const body = AppState.currentTurnEl.querySelector(".turn-body");
      const div = document.createElement("div");
      div.className = "turn-answer";
      div.appendChild(renderMarkdown(ev.answer));
      body.appendChild(div);
      AppState.currentTurnEl.open = true;
    } else {
      const div = document.createElement("div");
      div.className = "message answer";
      div.appendChild(renderMarkdown(ev.answer));
      feed.appendChild(div);
    }
    scrollFeed(true);
  } else if (ev.kind === "error") {
    add("error", ev.error);
  } else if (ev.kind === "status") {
    add("turn", ev.message);
  } else if (ev.kind === "done") {
    setRunning(false);
    loadSessions();
  }
}

async function listenEvents() {
  if (AppState.es) AppState.es.close();
  AppState.es = new EventSource("/api/events");
  AppState.es.onmessage = (e) => onEvent(JSON.parse(e.data));
  AppState.es.onerror = () => { console.log("SSE 连接断开，等待重连..."); };
}

/* ── 运行 / 停止 ── */
async function submitTask(task) {
  if (AppState.running || !task) return;
  if (AppState.viewingHistory) closeHistory();
  add("user", task);
  inputEl.value = "";
  inputEl.style.height = "auto";
  setRunning(true);
  const mode = document.getElementById("mode").value;
  const model = document.getElementById("model").value;
  const resp = await fetch("/api/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ task, mode, model, goal: AppState.sessionGoal })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ detail: "未知错误" }));
    add("error", err.detail || "启动失败");
    setRunning(false);
    return;
  }
  listenEvents();
}

async function abort() {
  await fetch("/api/abort", { method: "POST" });
  add("turn", "■ 停止请求已发送…");
}

function handleSubmit() {
  const task = inputEl.value.trim();
  if (task) {
    if (task.startsWith("/")) execLine(task);
    else submitTask(task);
  }
}

/* ── 历史会话：加载 + 渲染 ── */
async function openSession(file) {
  const resp = await fetch("/api/session?file=" + encodeURIComponent(file));
  if (!resp.ok) {
    const e = await resp.json().catch(() => ({}));
    add("error", e.detail || "加载会话失败");
    return;
  }
  const data = await resp.json();
  AppState.viewingHistory = true;
  AppState.currentSessionFile = file;
  document.getElementById("historyBar").style.display = "flex";
  document.getElementById("histTitle").textContent = "📜 " + (data.task || "历史会话");
  // 高亮侧边栏当前项
  document.querySelectorAll(".session-item").forEach(el => {
    el.classList.toggle("active", el.dataset.file === file);
  });
  feed.innerHTML = "";
  const turns = data.turns || [];
  if (!turns.length) {
    feed.innerHTML = '<div style="color:#3d444d;font-size:12px;padding:20px;text-align:center;">该会话暂无消息记录</div>';
    return;
  }
  turns.forEach((t, i) => {
    const det = document.createElement("details");
    det.className = "turn-block";
    if (i === turns.length - 1) det.open = true;  // 只展开最后一个 turn
    const toolCount = (t.steps || []).filter(s => s.tool !== "_think").length;
    const stepLabel = toolCount + " 个工具调用";
    det.innerHTML = "<summary><span class='turn-badge'>Turn " + (i + 1) + "</span>" +
      "<span class='turn-count'>" + stepLabel + "</span></summary>";
    const body = document.createElement("div");
    body.className = "turn-body";
    if (t.user) {
      const u = document.createElement("div");
      u.className = "turn-user";
      u.textContent = t.user;
      body.appendChild(u);
    }
    (t.steps || []).forEach(st => {
      if (st.tool === "_think") {
        const th = document.createElement("div");
        th.className = "think";
        th.textContent = "│ " + st.args;
        body.appendChild(th);
        return;
      }
      const sd = document.createElement("details");
      sd.className = "tool-details";
      const mark = st.success ? '<span class="ok">✓</span>' : '<span class="fail">✗</span>';
      sd.innerHTML = "<summary>" + mark + " <span class='tool-name'>" + escHtml(st.tool) + "</span></summary>";
      const sb = document.createElement("div");
      sb.className = "body";
      const argsTxt = parseArgs(st.args);
      if (argsTxt) {
        const al = document.createElement("div");
        al.className = "arg-label";
        al.textContent = "参数";
        sb.appendChild(al);
        sb.appendChild(document.createTextNode(argsTxt));
      }
      if (st.result != null) {
        const rl = document.createElement("div");
        rl.className = st.success ? "res-label" : "err-label";
        rl.textContent = st.success ? "结果" : "错误";
        sb.appendChild(rl);
        const rtxt = String(st.result);
        sb.appendChild(document.createTextNode(rtxt.length > 2000 ? rtxt.slice(0, 2000) + "\n…[截断]" : rtxt));
      }
      sd.appendChild(sb);
      body.appendChild(sd);
    });
    if (t.answer) {
      const a = document.createElement("div");
      a.className = "turn-answer";
      a.appendChild(renderMarkdown(t.answer));
      body.appendChild(a);
    }
    det.appendChild(body);
    feed.appendChild(det);
  });
  scrollFeed(true);
}

function closeHistory() {
  AppState.viewingHistory = false;
  AppState.currentSessionFile = null;
  document.getElementById("historyBar").style.display = "none";
  document.querySelectorAll(".session-item").forEach(el => el.classList.remove("active"));
  feed.innerHTML = "";
  add("turn", "已返回实时视图——运行新任务开始新的对话");
}

async function loadFiles(dir) {
  const tree = document.getElementById("filetree");
  tree.innerHTML = '<div style="color:#3d444d;font-size:11px;padding:8px;">加载中…</div>';
  const ws = (await (await fetch("/api/workspace")).json()).workspace;
  const target = dir || ws;
  const data = await (await fetch("/api/fs/browse?path=" + encodeURIComponent(target))).json();
  const fl = await (await fetch("/api/files?path=" + encodeURIComponent(target))).json();
  tree.innerHTML = "";
  if (data.parent !== null && !data.drives) {
    const up = document.createElement("div");
    up.className = "file-item";
    up.textContent = "↰ ..";
    up.onclick = () => loadFiles(data.parent);
    tree.appendChild(up);
  }
  data.dirs.forEach(d => {
    const b = document.createElement("div");
    b.className = "folder-item";
    b.textContent = "📁 " + d.split(/[\\/]/).pop();
    b.onclick = () => loadFiles(d);
    tree.appendChild(b);
  });
  fl.files.slice(0, 50).forEach(f => {
    const b = document.createElement("div");
    b.className = "file-item";
    b.textContent = "📄 " + f;
    b.onclick = () => viewFile(target + "\\" + f);
    tree.appendChild(b);
  });
  if (fl.files.length > 50) {
    const more = document.createElement("div");
    more.style.cssText = "font-size:11px;color:#3d444d;padding:8px;";
    more.textContent = "... 还有 " + (fl.files.length - 50) + " 个文件";
    tree.appendChild(more);
  }
}

  const d = await r.json();
  document.getElementById("fileTitle").textContent = d.path + "  (" + d.size + " 字符)";

let palItems = [], palIndex = -1;

function showParamHint(text) {
  const el = document.getElementById("paramHint");
  el.textContent = text;
  el.style.display = "block";
}
function hideParamHint() {
  document.getElementById("paramHint").style.display = "none";
}

function renderPalette(items) {
  palItems = items;
  palIndex = items.length ? 0 : -1;
  paletteEl.innerHTML = "";
  if (!items.length) {
    paletteEl.innerHTML = '<div class="empty">没有匹配的命令</div>';
  } else {
    paletteEl.innerHTML = '<div class="group-label">命令</div>';
    items.forEach((c, i) => {
      const div = document.createElement("div");
      div.className = "item" + (i === palIndex ? " active" : "");
      div.innerHTML = '<span class="name">' + escHtml(c.name) + '</span>' +
        '<span class="desc">' + escHtml(c.desc) + '</span>' +
        (c.hasArgs ? '<span class="kbd">参数</span>' : '<span class="kbd">⏎</span>');
      div.onclick = () => pickPalette(c);
      paletteEl.appendChild(div);
    });
  }
  paletteEl.style.display = "block";
}

function hidePalette() { paletteEl.style.display = "none"; palItems = []; palIndex = -1; }

function movePalette(dir) {
  if (!palItems.length) return;
  palIndex = (palIndex + dir + palItems.length) % palItems.length;
  [...paletteEl.querySelectorAll(".item")].forEach((el, i) => el.classList.toggle("active", i === palIndex));
}

function pickPalette(c) {
  if (c.hasArgs) {
    inputEl.value = c.name + " ";
    hidePalette();
    showParamHint("用法: " + c.desc + "（输入参数后按 Enter 执行）");
    inputEl.focus();
  } else {
    inputEl.value = c.name;
    hidePalette();
    execLine(c.name);
    inputEl.value = "";
    inputEl.style.height = "auto";
  }
}

function currentCommand() {
  const v = inputEl.value;
  if (!v.startsWith("/")) return null;
  const token = v.split(/\s+/)[0];
  return AppState.commands.find(c => c.name === token) || null;
}

function updatePalette() {
  const v = inputEl.value;
  if (AppState.running || !v.startsWith("/")) { hidePalette(); hideParamHint(); return; }
  const token = v.split(/\s+/)[0];
  renderPalette(AppState.commands.filter(c => c.name.startsWith(token)));
  // 已完整输入命令名时显示参数提示
  const cmd = AppState.commands.find(c => c.name === token);
  if (cmd && cmd.hasArgs && v.trim() === cmd.name) {
    showParamHint("用法: " + cmd.name + " " + (cmd.argHint || "<参数>") + "（Tab 继续输入，Enter 执行）");
  } else if (!v.includes(" ")) {
    hideParamHint();
  }
}

/* ── 输入事件 ── */
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  updatePalette();
});

inputEl.addEventListener("keydown", (e) => {
  const paletteOpen = paletteEl.style.display === "block";
  if (e.key === "Escape") {
    if (paletteOpen) { hidePalette(); hideParamHint(); e.preventDefault(); return; }
    if (AppState.running) { abort(); e.preventDefault(); }
    return;
  }
  if (paletteOpen && e.key === "ArrowDown") { movePalette(1); e.preventDefault(); return; }
  if (paletteOpen && e.key === "ArrowUp") { movePalette(-1); e.preventDefault(); return; }
  if (paletteOpen && e.key === "Tab") {
    if (palItems[palIndex]) {
      inputEl.value = palItems[palIndex].name + (palItems[palIndex].hasArgs ? " " : "");
      updatePalette();
    }
    e.preventDefault();
    return;
  }
  if (e.key === "Enter") {
    if (e.shiftKey) {
      // Shift+Enter：换行（默认行为），保持输入框自动增长
      e.preventDefault();
      inputEl.value += "\n";
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
      return;
    }
    // Enter：发送
    e.preventDefault();
    const v = inputEl.value.trim();
    if (!v) return;
    if (v.startsWith("/")) {
      const cmd = currentCommand();
      const isComplete = cmd && (v === cmd.name || v.startsWith(cmd.name + " "));
      if (paletteOpen && palItems[palIndex] && !isComplete) {
        // 部分输入：Enter 选择高亮项（补全或执行）
        pickPalette(palItems[palIndex]);
        return;
      }
      hidePalette();
      hideParamHint();
      execLine(v);
      inputEl.value = "";
      inputEl.style.height = "auto";
      return;
    }
    hidePalette();
    hideParamHint();
    submitTask(v);
  }
});

/* ── 命令执行 ── */
async function execLine(line) {
  const parts = line.split(/\s+/);
  const cmd = parts[0], arg = parts.slice(1).join(" ");
  if (cmd === "/help") {
    const card = add("answer", "");
    card.innerHTML = "<b>可用命令</b><br>" + AppState.commands.map(c => "  " + c.name + " — " + c.desc).join("<br>");
    card.style.whiteSpace = "pre-wrap";
  } else if (cmd === "/status") {
    const s = await (await fetch("/api/status")).json();
    add("answer", "运行中: " + s.running + " | 模型: " + s.model +
      " | 模式: " + s.mode + "\n工作区: " + s.workspace +
      (AppState.sessionGoal ? "\n会话目标: " + AppState.sessionGoal : ""));
  } else if (cmd === "/tools") {
    const d = await (await fetch("/api/tools")).json();
    const card = add("answer", "");
    card.innerHTML = "<b>可用工具 (" + d.tools.length + ")</b><br>" +
      d.tools.map(t => "  " + t.name + " — " + t.description.substring(0, 60) + "...").join("<br>");
    card.style.whiteSpace = "pre-wrap";
  } else if (cmd === "/model") {
    if (!arg) {
      await loadModels();
      if (AppState.models.length) {
        const cur = document.getElementById("model").value;
        if (!AppState.models.includes(cur)) document.getElementById("model").value = AppState.models[0];
        add("answer", "在线模型:\n" + AppState.models.map(m =>
          (m === document.getElementById("model").value ? "  ← " : "  ") + m).join("\n"));
      } else add("error", "在线模型列表不可用");
    } else {
      document.getElementById("model").value = arg;
      saveModelOnly(arg);
      add("answer", "模型已切换: " + arg + "（下次运行生效）");
    }
  } else if (cmd === "/mode") {
    if (["full", "goal", "plan", "dry-run"].includes(arg)) {
      document.getElementById("mode").value = arg;
      add("answer", "模式已切换: " + arg);
    } else add("answer", "当前模式: " + document.getElementById("mode").value +
      "（用法: /mode full|goal|plan|dry-run）");
  } else if (cmd === "/goal") {
    if (arg === "clear") {
      AppState.sessionGoal = "";
      localStorage.removeItem('coder_goal');
      add("answer", "会话目标已清除");
    } else if (arg) {
      AppState.sessionGoal = arg;
      localStorage.setItem('coder_goal', arg);
      add("answer", "会话目标已设置: " + arg + "\n将随每次运行注入系统提示");
    } else add("answer", AppState.sessionGoal ? "当前会话目标: " + AppState.sessionGoal : "未设置（用法: /goal <text>）");
  } else if (cmd === "/sessions") {
    const d = await (await fetch("/api/sessions")).json();
    const card = add("answer", "");
    card.innerHTML = d.sessions.length
      ? "<b>会话列表（点击侧边栏查看详情）:</b><br>" + d.sessions.map((s, i) => (i + 1) + ". " + (s.task || "无标题")).join("<br>")
      : "没有会话——先运行一次任务";
    card.style.whiteSpace = "pre-wrap";
  } else if (cmd === "/resume") {
    if (AppState.running) {
      add("error", "当前有任务在运行，请先停止");
      return;
    }
    setRunning(true);
    const resp = await fetch("/api/resume", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task: arg || "继续之前的任务", goal: AppState.sessionGoal, resume: "" })
    });
    if (!resp.ok) {
      add("error", (await resp.json().catch(() => ({}))).detail || "恢复失败");
      setRunning(false);
      return;
    }
    listenEvents();
  } else if (cmd === "/clear") {
    feed.innerHTML = "";
    AppState.currentTurnEl = null;
  } else {
    add("error", "未知命令: " + cmd + "（/help 查看命令列表）");
  }
}

/* ── 初始化 ── */
async function init() {
  await Promise.all([
    loadSessions(),
    loadWorkspace(),
    loadCommands(),
    loadModels(),
  ]);
  // 从配置恢复当前模型
  try {
    const cfg = await (await fetch("/api/config")).json();
    document.getElementById("model").value = cfg.model || document.getElementById("model").value;
  } catch (e) {}
}

init();
</script>
