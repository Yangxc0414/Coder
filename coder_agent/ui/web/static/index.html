<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coder-Agent 客户端</title>
<style>
  /* ═══════════ 主题变量（暗色默认 / 亮色 data-theme="light"） ═══════════ */
  :root {
    --bg: #0d0f12; --bg2: #111418; --bg3: #1a1f26; --bg4: #14171c;
    --text: #e6e6e6; --muted: #8e9aa8; --faint: #3d444d;
    --border: #1e2329; --border2: #2a2e36;
    --accent: #4fc3f7; --accent2: #1e88e5;
    --ok: #66bb6a; --err: #ef5350;
    --user-bg: #1e3a5f; --answer-bg: #16321f; --answer-border: #2e7d32;
    --code-bg: #0d0f12; --code-text: #c8e1ff;
    --danger: #c62828; --danger-hover: #b71c1c;
    --shadow: rgba(0,0,0,.5);
    --scrollbar: #2a2e36;
  }
  body[data-theme="light"] {
    --bg: #f5f6f8; --bg2: #ffffff; --bg3: #eef0f3; --bg4: #f0f2f5;
    --text: #1a1d21; --muted: #5b6470; --faint: #9aa3af;
    --border: #e2e5ea; --border2: #d3d8de;
    --accent: #2563eb; --accent2: #1d4ed8;
    --ok: #16a34a; --err: #dc2626;
    --user-bg: #dbeafe; --answer-bg: #f0fdf4; --answer-border: #86efac;
    --code-bg: #f8fafc; --code-text: #1e293b;
    --danger: #dc2626; --danger-hover: #b91c1c;
    --shadow: rgba(0,0,0,.15);
    --scrollbar: #d3d8de;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; overflow: hidden; transition: background .25s, color .25s; }

  /* ── 侧边栏 ── */
  aside { width: 250px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .sidebar-header h1 { font-size: 14px; color: var(--accent); font-weight: 600; letter-spacing: .5px; }
  .sidebar-tabs { display: flex; gap: 4px; padding: 10px 14px 6px; }
  .sidebar-tab { flex: 1; padding: 6px; font-size: 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; text-align: center; transition: all .15s; }
  .sidebar-tab.active { background: var(--user-bg); border-color: var(--accent); color: var(--accent); }
  .sidebar-tab:hover:not(.active) { border-color: var(--border2); color: var(--text); }
  .sidebar-content { flex: 1; overflow-y: auto; padding: 8px 14px; display: flex; flex-direction: column; }
  #pane-files { display: none; }
  .sidebar-content::-webkit-scrollbar { width: 4px; }
  .sidebar-content::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }
  .session-item { position: relative; padding: 8px 10px; font-size: 11px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; margin-bottom: 4px; transition: all .15s; word-break: break-all; line-height: 1.4; }
  .session-item:hover, .session-item.active { border-color: var(--accent); color: var(--text); }
  .session-item .session-meta { font-size: 10px; color: var(--faint); margin-top: 2px; display: flex; gap: 8px; }
  .session-item .session-del { display: none; position: absolute; top: 6px; right: 6px; background: none; border: none; color: var(--faint); cursor: pointer; font-size: 12px; padding: 2px 4px; }
  .session-item:hover .session-del { display: block; }
  .session-item .session-del:hover { color: var(--err); }
  .refresh-btn { width: 100%; padding: 8px; font-size: 11px; background: transparent; border: 1px dashed var(--border2); border-radius: 6px; color: var(--faint); cursor: pointer; margin-top: 8px; transition: all .15s; }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .file-item { padding: 6px 10px; font-size: 11px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; color: var(--muted); cursor: pointer; margin-bottom: 2px; transition: all .15s; }
  .file-item:hover { border-color: var(--accent); color: var(--text); }
  .folder-item { padding: 6px 10px; font-size: 11px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; color: var(--accent); cursor: pointer; margin-bottom: 2px; transition: all .15s; }
  .folder-item:hover { border-color: var(--accent); background: var(--user-bg); }

  /* ── 主区域 ── */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); position: relative; }

  /* ── 头部 ── */
  header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--bg2); }
  .header-group { display: flex; gap: 8px; align-items: center; position: relative; }
  .header-label { font-size: 12px; color: var(--faint); }
  select, input[type=text], input[type=password] { background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 12px; outline: none; transition: border-color .15s; }
  select:focus, input[type=text]:focus, input[type=password]:focus { border-color: var(--accent); }
  .header-btn { background: var(--bg3); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .header-btn:hover { border-color: var(--accent); color: var(--accent); }
  .header-btn.active { border-color: var(--accent); color: var(--accent); background: var(--user-bg); }
  .status-indicator { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); transition: background .3s; }
  .status-dot.running { background: var(--accent); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .workspace-path { font-size: 11px; color: var(--faint); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── 对话流 ── */
  #feed { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #feed::-webkit-scrollbar { width: 6px; }
  #feed::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
  .message { max-width: 85%; animation: fadeIn .2s ease; position: relative; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .user { align-self: flex-end; background: var(--user-bg); border-radius: 12px 12px 2px 12px; padding: 10px 14px; font-size: 13px; line-height: 1.5; }
  .answer { align-self: flex-start; background: var(--answer-bg); border: 1px solid var(--answer-border); border-radius: 12px 12px 12px 2px; padding: 12px 16px; font-size: 13px; line-height: 1.6; }
  .think { color: var(--muted); font-size: 12px; white-space: pre-wrap; border-left: 2px solid var(--border2); padding-left: 10px; margin: 4px 0; }
  .turn { align-self: center; color: var(--faint); font-size: 11px; padding: 4px 12px; }
  .error { align-self: flex-start; background: var(--danger); color: #fff; border-radius: 8px; padding: 10px 14px; font-size: 12px; }

  /* 消息操作按钮（hover 显示） */
  .msg-ops { position: absolute; top: -10px; right: 6px; display: none; gap: 4px; z-index: 5; }
  .message:hover .msg-ops { display: flex; }
  .msg-ops button { background: var(--bg3); border: 1px solid var(--border); color: var(--muted); border-radius: 4px; font-size: 10px; padding: 2px 7px; cursor: pointer; box-shadow: 0 2px 6px var(--shadow); }
  .msg-ops button:hover { color: var(--accent); border-color: var(--accent); }

  /* ── Turn 分组容器 ── */
  .turn-block { align-self: stretch; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--bg2); margin: 2px 0; }
  .turn-block summary { padding: 8px 14px; cursor: pointer; font-size: 12px; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; user-select: none; }
  .turn-block summary:hover { background: var(--bg4); }
  .turn-block summary::before { content: "▸"; color: var(--faint); transition: transform .15s; }
  .turn-block[open] summary::before { transform: rotate(90deg); }
  .turn-block .turn-badge { font-family: Consolas, monospace; color: var(--accent); }
  .turn-block .turn-count { color: var(--faint); font-size: 11px; margin-left: auto; }
  .turn-block .turn-body { padding: 6px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .turn-block .turn-user { align-self: flex-end; background: var(--user-bg); border-radius: 10px 10px 2px 10px; padding: 8px 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; max-width: 85%; }
  .turn-block .turn-answer { align-self: flex-start; background: var(--answer-bg); border: 1px solid var(--answer-border); border-radius: 10px 10px 10px 2px; padding: 10px 14px; font-size: 13px; line-height: 1.6; max-width: 85%; }

  details.tool-details { align-self: stretch; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
  details.tool-details summary { padding: 7px 12px; cursor: pointer; font-size: 12px; font-family: Consolas, monospace; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; background: var(--bg4); }
  details.tool-details summary:hover { background: var(--bg3); }
  details.tool-details summary::before { content: "▸"; color: var(--faint); }
  details.tool-details[open] summary::before { transform: rotate(90deg); }
  details.tool-details .ok { color: var(--ok); }
  details.tool-details .fail { color: var(--err); }
  details.tool-details .tool-name { color: var(--accent); }
  details.tool-details .tool-target { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }
  details.tool-details .body { padding: 10px 12px; font-family: Consolas, monospace; font-size: 11px; color: var(--code-text); max-height: 240px; overflow: auto; white-space: pre-wrap; line-height: 1.5; }
  details.tool-details .body::-webkit-scrollbar { width: 4px; }
  details.tool-details .body::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }
  details.tool-details .arg-label { color: var(--accent); margin: 6px 0 2px; font-weight: bold; }
  details.tool-details .res-label { color: var(--ok); margin: 8px 0 2px; font-weight: bold; }
  details.tool-details .err-label { color: var(--err); margin: 8px 0 2px; font-weight: bold; }

  /* ── 历史会话视图工具栏 ── */
  #historyBar { display: none; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--bg2); font-size: 12px; color: var(--muted); align-items: center; gap: 10px; }
  #historyBar .back-btn { background: none; border: 1px solid var(--border2); color: var(--muted); border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
  #historyBar .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  #historyBar .hist-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #historyBar .hist-actions { display: flex; gap: 6px; }
  #historyBar .hist-actions button { background: none; border: 1px solid var(--border2); color: var(--muted); border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
  #historyBar .hist-actions button:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Markdown 渲染 ── */
  .md h1, .md h2, .md h3 { margin: 12px 0 8px; color: var(--text); font-weight: 600; }
  .md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14px; }
  .md p { margin: 8px 0; line-height: 1.6; }
  .md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; margin: 10px 0; position: relative; }
  .md pre code { font-family: Consolas, monospace; font-size: 12px; color: var(--code-text); }
  .md code.inline { background: var(--bg3); border-radius: 4px; padding: 2px 6px; font-family: Consolas, monospace; color: var(--code-text); font-size: 12px; }
  .md ul, .md ol { margin: 8px 0 8px 20px; }
  .md li { margin: 4px 0; line-height: 1.5; }
  .copy-btn { position: absolute; top: 8px; right: 8px; background: var(--bg3); color: var(--faint); border: 1px solid var(--border); border-radius: 4px; font-size: 10px; padding: 3px 8px; cursor: pointer; transition: all .15s; }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* ── 底部栏 ── */
  #footer { padding: 8px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--faint); display: flex; gap: 16px; background: var(--bg2); align-items: center; }
  .footer-stat { display: flex; align-items: center; gap: 4px; }
  .footer-stat span { color: var(--faint); }
  #goalBadge { display: none; align-items: center; gap: 4px; cursor: pointer; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 1px 10px; font-size: 11px; color: var(--accent); }
  #goalBadge:hover { border-color: var(--accent); }
  .footer-right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
  .theme-btn { background: none; border: 1px solid var(--border2); color: var(--muted); border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── 斜杠命令面板 ── */
  #palette { display: none; position: absolute; bottom: 110px; left: 16px; right: 16px; background: var(--bg2); border: 1px solid var(--border2); border-radius: 10px; max-height: 300px; overflow-y: auto; z-index: 40; box-shadow: 0 -4px 24px var(--shadow); }
  #palette .group-label { padding: 8px 14px 2px; font-size: 10px; color: var(--faint); letter-spacing: 1px; text-transform: uppercase; }
  #palette .item { padding: 10px 14px; cursor: pointer; display: flex; gap: 12px; align-items: center; transition: background .15s; }
  #palette .item:hover, #palette .item.active { background: var(--bg3); }
  #palette .item .name { color: var(--accent); font-family: Consolas, monospace; font-size: 12px; min-width: 120px; }
  #palette .item .desc { color: var(--muted); font-size: 11px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #palette .item .stat { color: var(--faint); font-size: 10px; font-family: Consolas, monospace; margin-left: auto; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #palette .item .kbd { color: var(--faint); font-size: 10px; border: 1px solid var(--border2); border-radius: 3px; padding: 1px 5px; }
  #palette .empty { padding: 12px 14px; color: var(--faint); font-size: 12px; }
  #paramHint { display: none; font-size: 11px; color: var(--accent); padding: 2px 4px; }

  /* ── 输入框 ── */
  form { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--bg2); flex-direction: column; }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-family: inherit; font-size: 13px; line-height: 1.5; resize: none; overflow: hidden; max-height: 160px; transition: border-color .15s; }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea::placeholder { color: var(--faint); }
  .input-hint { font-size: 11px; color: var(--faint); padding: 4px 0; }
  button.primary { background: var(--accent2); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap; }
  button.primary:hover { filter: brightness(1.1); }
  button.primary:disabled { background: var(--bg3); color: var(--faint); cursor: not-allowed; }
  button.stop { background: var(--danger); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: 13px; cursor: pointer; transition: all .15s; display: none; }
  button.stop:hover { background: var(--danger-hover); }

  /* ── 模态框 ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; backdrop-filter: blur(4px); }
  .modal-overlay.show { display: block; }
  .modal-content { background: var(--bg2); border: 1px solid var(--border2); border-radius: 12px; margin: 60px auto; padding: 20px; max-width: 600px; box-shadow: 0 12px 40px var(--shadow); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header b { font-size: 14px; color: var(--text); }
  .modal-close { background: none; color: var(--faint); border: none; cursor: pointer; font-size: 18px; padding: 4px; }
  .modal-close:hover { color: var(--text); }
  .config-row { margin-bottom: 14px; }
  .config-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .config-row input, .config-row select { width: 100%; padding: 8px 12px; }
  .config-hint { font-size: 11px; color: var(--faint); margin-top: 4px; }
  #fileBody { flex: 1; overflow: auto; background: var(--code-bg); border-radius: 8px; padding: 14px; font-family: Consolas, monospace; font-size: 12px; color: var(--code-text); white-space: pre-wrap; line-height: 1.5; }
  #fileBody::-webkit-scrollbar { width: 6px; }
  #fileBody::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
  #dirList { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  #dirList::-webkit-scrollbar { width: 4px; }
  #dirList::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }
  #modelDropdown { display: none; position: absolute; top: 100%; left: 0; margin-top: 4px; background: var(--bg2); border: 1px solid var(--border2); border-radius: 8px; max-height: 200px; overflow-y: auto; z-index: 30; min-width: 220px; box-shadow: 0 4px 12px var(--shadow); }
  #modelDropdown .model-item { padding: 8px 12px; font-size: 12px; cursor: pointer; color: var(--muted); transition: background .15s; }
  #modelDropdown .model-item:hover { background: var(--bg3); color: var(--accent); }
  #modelDropdown .model-item.selected { color: var(--accent); font-weight: 600; }
  .input-wrapper { position: relative; }

  /* ── 欢迎页 ── */
  #welcome { margin: auto; max-width: 620px; text-align: center; padding: 30px 20px; animation: fadeIn .4s ease; }
  .welcome-logo { font-size: 52px; margin-bottom: 8px; }
  .welcome h2 { font-size: 24px; color: var(--text); margin-bottom: 4px; }
  .welcome .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .feature-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; text-align: left; transition: all .2s; }
  .feature-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 14px var(--shadow); }
  .feature-card .fc-icon { font-size: 20px; margin-bottom: 6px; }
  .feature-card .fc-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .feature-card .fc-desc { font-size: 11px; color: var(--muted); line-height: 1.5; }
  .suggest-label { font-size: 11px; color: var(--faint); margin-bottom: 8px; }
  .suggest-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .chip { background: var(--bg2); border: 1px solid var(--border2); color: var(--muted); border-radius: 16px; padding: 6px 14px; font-size: 12px; cursor: pointer; transition: all .15s; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .shortcut-hint { font-size: 11px; color: var(--faint); line-height: 1.9; }
  .shortcut-hint b { color: var(--muted); font-family: Consolas, monospace; border: 1px solid var(--border2); border-radius: 3px; padding: 0 5px; margin-right: 4px; }

  /* ── 活动面板 ── */
  #activityPanel { display: none; position: absolute; top: 0; right: 0; bottom: 0; width: 280px; background: var(--bg2); border-left: 1px solid var(--border); z-index: 20; flex-direction: column; animation: slideIn .2s ease; }
  #activityPanel.show { display: flex; }
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .activity-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--text); }
  .activity-header button { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 14px; }
  .activity-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
  .activity-body::-webkit-scrollbar { width: 4px; }
  .activity-body::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }
  .act-section .as-title { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .act-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .act-stat { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
  .act-stat .val { font-size: 18px; font-weight: 700; color: var(--accent); font-family: Consolas, monospace; }
  .act-stat .lbl { font-size: 10px; color: var(--faint); margin-top: 2px; }
  .tool-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 11px; }
  .tool-bar-row .tname { color: var(--muted); width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: Consolas, monospace; }

</style>
</head>

<script>
/* ═══════════ 状态管理 ═══════════ */
const AppState = {
  running: false,
  sessionGoal: localStorage.getItem('coder_goal') || '',
  sessionCount: 0,
  commands: [],
  models: [],
  es: null,
  currentTurnEl: null,
  viewingHistory: false,
  currentSessionFile: null,
  sessionData: null,   // 当前历史会话数据（导出用）
};
const Stats = { tokens: 0, steps: 0, tools: {}, writes: [], reads: [], lastToolAt: null };

const feed = document.getElementById("feed");
const inputEl = document.getElementById("task");
const paletteEl = document.getElementById("palette");

/* ═══════════ 工具函数 ═══════════ */
function escHtml(s) { return s ? String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ""; }
function nearBottom() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 100; }
function scrollFeed(force) { if (force || nearBottom()) feed.scrollTop = feed.scrollHeight; }
function add(cls, text) {
  const stick = nearBottom();
  const div = document.createElement("div");
  div.className = "message " + cls;
  div.textContent = text;
  feed.appendChild(div);
  scrollFeed(stick || cls === "user");
  return div;
}
function parseArgs(argsStr) {
  try {
    const o = JSON.parse(argsStr || "{}");
    return Object.entries(o).map(([k, v]) => {
      let vs = typeof v === "object" ? JSON.stringify(v) : String(v);
      if (vs.length > 300) vs = vs.slice(0, 300) + "…";
      return k + ": " + vs;
    }).join("\n");
  } catch (e) { return argsStr; }
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) { return false; }
}
function msgOps(btnText, fn) {
  const wrap = document.createElement("div");
  wrap.className = "msg-ops";
  const b = document.createElement("button");
  b.textContent = btnText;
  b.onclick = fn;
  wrap.appendChild(b);
  return wrap;
}

/* ═══════════ Mini-Markdown 渲染 ═══════════ */
function renderMarkdown(md) {
  if (!md) return document.createElement("div");
  const blocks = md.split(/\n```/);
  let html = "";
  const codeStore = [];
  blocks.forEach((blk, bi) => {
    if (bi % 2 === 1) {
      const nl = blk.indexOf("\n");
      const body = nl >= 0 ? blk.slice(nl + 1) : blk;
      const id = "code_" + codeStore.length;
      codeStore.push(body.replace(/\n$/, ""));
      html += '<pre><code>' + escHtml(body.replace(/\n$/, "")) +
              '</code><button class="copy-btn" data-code="' + id + '">复制</button></pre>';
      return;
    }
    let seg = escHtml(blk);
    seg = seg.replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>');
    seg = seg.replace(/^###\s?(.+)$/gm, "<h3>$1</h3>");
    seg = seg.replace(/^##\s?(.+)$/gm, "<h2>$1</h2>");
    seg = seg.replace(/^#\s?(.+)$/gm, "<h1>$1</h1>");
    seg = seg.replace(/^\s?[-*]\s+(.+)$/gm, "<li>$1</li>");
    seg = seg.replace(/^(\d+)\.\s+(.+)$/gm, "<li>$2</li>");
    seg = seg.replace(/(<li>.*?<\/li>)/gs, (m) => m.includes("</ul>") || m.includes("</ol>") ? m : "<ul>" + m + "</ul>");
    seg = seg.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    html += "<div class='md'>" + seg + "</div>";
  });
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  wrap.querySelectorAll(".copy-btn").forEach(btn => {
    btn.onclick = () => {
      const code = codeStore[+btn.dataset.code.slice(5)] || "";
      copyText(code);
      btn.textContent = "已复制";
      setTimeout(() => btn.textContent = "复制", 1200);
    };
  });
  return wrap;
}

/* ═══════════ 主题切换 ═══════════ */
function applyTheme(theme) {
  document.body.dataset.theme = theme;
  localStorage.setItem('coder_theme', theme);
  const icon = theme === "light" ? "☀️" : "🌙";
  document.getElementById("themeBtn").textContent = icon;
  document.getElementById("themeBtn2").textContent = icon;
}
function toggleTheme() {
  const cur = document.body.dataset.theme || "dark";
  applyTheme(cur === "dark" ? "light" : "dark");
}

/* ═══════════ 欢迎页 ═══════════ */
const FEATURES = [
  { icon: "🔁", title: "ReAct 循环", desc: "思考→行动→观察，手写实现，无任何 agent 框架" },
  { icon: "🚦", title: "PolicyGate 策略闸门", desc: "危险命令/越界写文件在执行前拦截" },
  { icon: "📦", title: "三层上下文压缩", desc: "对话 / 工作区 / 长程记忆分层管理 token" },
  { icon: "✅", title: "LLM Verifier 自校验", desc: "运行结果自动验证，失败自动修复重试" },
  { icon: "📜", title: "Session Journal", desc: "消息全量落盘，断点续跑不丢失进度" },
  { icon: "🧠", title: "Memory + Task 委托", desc: "记忆工具 + 子任务分解并行执行" },
];
const SUGGESTS = [
  "扫描当前目录结构并总结这个项目",
  "运行测试并修复所有失败项",
  "给项目根目录写一个简洁的 README.md",
  "检查代码中是否有明显的 bug 并修复",
];
function renderWelcome() {
  if (feed.children.length) return;
  const w = document.createElement("div");
  w.id = "welcome";
  w.innerHTML = '<div class="welcome-logo">🧠</div>' +
    "<h2>Coder-Agent</h2>" +
    '<div class="sub">自研编码智能体 · 零框架 · 可答辩 · 可演示</div>' +
    '<div class="feature-grid">' + FEATURES.map(f =>
      '<div class="feature-card"><div class="fc-icon">' + f.icon + '</div>' +
      '<div class="fc-title">' + f.title + '</div><div class="fc-desc">' + f.desc + '</div></div>'
    ).join("") + '</div>' +
    '<div class="suggest-label">试一试：</div>' +
    '<div class="suggest-chips">' + SUGGESTS.map(s =>
      '<button class="chip" data-s="' + escHtml(s) + '">' + escHtml(s) + '</button>'
    ).join("") + '</div>' +
    '<div class="shortcut-hint">' +
    "<b>Enter</b> 发送 &nbsp; <b>Shift+Enter</b> 换行 &nbsp; <b>/</b> 命令面板 &nbsp; " +
    "<b>Ctrl+K</b> 清空 &nbsp; <b>Ctrl+L</b> 主题 &nbsp; <b>Ctrl+O</b> 文件夹 &nbsp; <b>Ctrl+,</b> 设置" +
    '</div>';
  w.querySelectorAll(".chip").forEach(c => {
    c.onclick = () => { inputEl.value = c.dataset.s; inputEl.focus(); };
  });
  feed.appendChild(w);
}

/* ═══════════ 运行状态 ═══════════ */
function setRunning(v) {
  AppState.running = v;
  document.getElementById("state").textContent = v ? "运行中…" : "空闲";
  document.getElementById("statusDot").className = "status-dot" + (v ? " running" : "");
  document.getElementById("stop").style.display = v ? "inline-block" : "none";
  document.getElementById("send").disabled = v;
  document.getElementById("f-mode").textContent = document.getElementById("mode").value;
}

/* ═══════════ Turn 容器 ═══════════ */
function beginTurn(step) {
  const det = document.createElement("details");
  det.className = "turn-block";
  det.open = true;
  det.innerHTML = "<summary><span class='turn-badge'>Turn " + step + "</span>" +
    "<span class='turn-count'>0 步</span></summary><div class='turn-body'></div>";
  if (AppState.currentTurnEl) AppState.currentTurnEl.open = false;
  feed.appendChild(det);
  AppState.currentTurnEl = det;
  scrollFeed(true);
  return det.querySelector(".turn-body");
}
function appendToolToTurn(ev) {
  if (!AppState.currentTurnEl) beginTurn(ev.step || 1);
  const body = AppState.currentTurnEl.querySelector(".turn-body");
  const det = document.createElement("details");
  det.className = "tool-details";
  const mark = ev.success ? '<span class="ok">✓</span>' : '<span class="fail">✗</span>';
  det.innerHTML = "<summary>" + mark +
    " <span class='tool-name'>" + escHtml(ev.tool) + "</span>" +
    (ev.target ? " <span class='tool-target'>→ " + escHtml(ev.target) + "</span>" : "") +
    "</summary><div class='body'>" +
    (ev.detail ? "<span class='err-label'>error</span>\n" + escHtml(ev.detail) + "\n" : "") +
    (ev.preview || "(无输出)") + "</div>";
  body.appendChild(det);
  const n = body.querySelectorAll("details.tool-details").length;
  AppState.currentTurnEl.querySelector(".turn-count").textContent = n + " 步";
  scrollFeed(nearBottom());
}

/* ═══════════ 统计累积 ═══════════ */
function trackTool(ev) {
  Stats.tools[ev.tool] = (Stats.tools[ev.tool] || 0) + 1;
  const t = ev.target || "";
  if (/[\\/]/.test(t) || t.includes(".")) {
    if (["write_file", "edit_file", "append_file"].includes(ev.tool)) {
      if (!Stats.writes.includes(t)) Stats.writes.push(t);
    } else if (ev.tool === "read_file") {
      if (!Stats.reads.includes(t)) Stats.reads.push(t);
    }
  }
}
function renderActivity() {
  const body = document.getElementById("activityBody");
  const toolEntries = Object.entries(Stats.tools).sort((a, b) => b[1] - a[1]);
  const maxCnt = toolEntries.length ? toolEntries[0][1] : 1;
  let html = "";
  // 运行统计
  html += "<div class='act-section'><div class='as-title'>运行统计</div><div class='act-stats'>" +
    "<div class='act-stat'><div class='val'>" + Stats.tokens + "</div><div class='lbl'>tokens</div></div>" +
    "<div class='act-stat'><div class='val'>" + Stats.steps + "</div><div class='lbl'>steps</div></div>" +
    "<div class='act-stat'><div class='val'>" + toolEntries.reduce((s, e) => s + e[1], 0) + "</div><div class='lbl'>工具调用</div></div>" +
    "<div class='act-stat'><div class='val'>" + Stats.writes.length + "</div><div class='lbl'>文件改动</div></div>" +
    "</div></div>";
  // 工具分布
  if (toolEntries.length) {
    html += "<div class='act-section'><div class='as-title'>工具使用</div>";
    toolEntries.slice(0, 8).forEach(([name, cnt]) => {
      html += "<div class='tool-bar-row'><span class='tname'>" + escHtml(name) + "</span>" +
        "<div class='tbar'><i style='width:" + Math.round(cnt / maxCnt * 100) + "%'></i></div>" +
        "<span class='tcnt'>" + cnt + "</span></div>";
    });
    html += "</div>";
  }
  // 文件改动
  if (Stats.writes.length || Stats.reads.length) {
    html += "<div class='act-section'><div class='as-title'>文件活动</div>";
    Stats.writes.forEach(f => { html += "<div class='act-file'><span class='w'>✎</span>" + escHtml(f) + "</div>"; });
    Stats.reads.slice(-8).forEach(f => { html += "<div class='act-file'><span class='r'>👁</span>" + escHtml(f) + "</div>"; });
    html += "</div>";
  }
  // 会话目标
  html += "<div class='act-section'><div class='as-title'>会话目标</div>" +
    (AppState.sessionGoal
      ? "<div class='act-goal'>🎯 " + escHtml(AppState.sessionGoal) + "</div>"
      : "<div class='act-empty'>未设置 — 输入 /goal 设置目标</div>") +
    "</div>";
  // 配置摘要
  html += "<div class='act-section'><div class='as-title'>当前配置</div>" +
    "<div class='act-goal'>🤖 " + escHtml(document.getElementById("model").value) +
    "<br>⚙ " + escHtml(document.getElementById("mode").value) +
    "<br>📂 " + escHtml(document.getElementById("ws").textContent.replace(/^📂\s*/, "")) + "</div></div>";
  body.innerHTML = html || '<div class="act-empty">暂无数据 — 运行一个任务后查看</div>';
}
function toggleActivity() {
  const p = document.getElementById("activityPanel");
  const b = document.getElementById("activityBtn");
  const show = !p.classList.contains("show");
  p.classList.toggle("show", show);
  b.classList.toggle("active", show);
  if (show) renderActivity();
}

/* ═══════════ SSE 事件渲染 ═══════════ */
function onEvent(ev) {
  if (ev.kind === "text") {
    const t = (ev.text || "").trim();
    if (!t) return;
    if (!AppState.currentTurnEl) beginTurn(ev.step || 1);
    const body = AppState.currentTurnEl.querySelector(".turn-body");
    const div = document.createElement("div");
    div.className = "think";
    div.textContent = "│ " + (t.length > 600 ? t.slice(0, 600) + "…" : t);
    body.appendChild(div);
    scrollFeed(nearBottom());
  } else if (ev.kind === "tool") {
    appendToolToTurn(ev);
    trackTool(ev);
  } else if (ev.kind === "turn") {
    beginTurn(ev.step);
    Stats.tokens = ev.tokens || 0;
    Stats.steps = ev.step;
    document.getElementById("f-tokens").textContent = Stats.tokens;
    document.getElementById("f-steps").textContent = Stats.steps;
  } else if (ev.kind === "answer") {
    if (AppState.currentTurnEl) {
      const body = AppState.currentTurnEl.querySelector(".turn-body");
      const div = document.createElement("div");
      div.className = "turn-answer";
      div.appendChild(renderMarkdown(ev.answer));
      body.appendChild(div);
      AppState.currentTurnEl.open = true;
    } else {
      const div = document.createElement("div");
      div.className = "message answer";
      div.appendChild(renderMarkdown(ev.answer));
      feed.appendChild(div);
    }
    scrollFeed(true);
  } else if (ev.kind === "error") {
    add("error", ev.error);
  } else if (ev.kind === "status") {
    add("turn", ev.message);
  } else if (ev.kind === "done") {
    setRunning(false);
    loadSessions();
    if (document.getElementById("activityPanel").classList.contains("show")) renderActivity();
  }
}
async function listenEvents() {
  if (AppState.es) AppState.es.close();
  AppState.es = new EventSource("/api/events");
  AppState.es.onmessage = (e) => onEvent(JSON.parse(e.data));
  AppState.es.onerror = () => { console.log("SSE 连接断开，等待重连..."); };
}

/* ═══════════ 运行 / 停止 ═══════════ */
async function submitTask(task) {
  if (AppState.running || !task) return;
  if (AppState.viewingHistory) closeHistory();
  document.getElementById("welcome")?.remove();
  const um = add("user", task);
  um.appendChild(msgOps("↻ 重跑", () => submitTask(task)));
  um.appendChild(msgOps("⧉ 复制", () => copyText(task)));
  inputEl.value = "";
  inputEl.style.height = "auto";
  setRunning(true);
  const mode = document.getElementById("mode").value;
  const model = document.getElementById("model").value;
  const resp = await fetch("/api/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ task, mode, model, goal: AppState.sessionGoal })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ detail: "未知错误" }));
    add("error", err.detail || "启动失败");
    setRunning(false);
    return;
  }
  listenEvents();
}

}
function handleSubmit() {
  const task = inputEl.value.trim();
  if (task) {
    if (task.startsWith("/")) execLine(task);
    else submitTask(task);
  }
}

/* ═══════════ 历史会话 ═══════════ */
async function openSession(file) {
  const resp = await fetch("/api/session?file=" + encodeURIComponent(file));
  if (!resp.ok) {
    const e = await resp.json().catch(() => ({}));
    add("error", e.detail || "加载会话失败");
    return;
  }
  const data = await resp.json();
  AppState.viewingHistory = true;
  AppState.currentSessionFile = file;
  AppState.sessionData = data;
  document.getElementById("historyBar").style.display = "flex";
  document.getElementById("histTitle").textContent = "📜 " + (data.task || "历史会话");
  document.querySelectorAll(".session-item").forEach(el => el.classList.toggle("active", el.dataset.file === file));
  feed.innerHTML = "";
  const turns = data.turns || [];
  if (!turns.length) {
    feed.innerHTML = '<div style="color:var(--faint);font-size:12px;padding:20px;text-align:center;">该会话暂无消息记录</div>';
    return;
  }
  turns.forEach((t, i) => {
    const det = document.createElement("details");
    det.className = "turn-block";
    if (i === turns.length - 1) det.open = true;
    const toolCount = (t.steps || []).filter(s => s.tool !== "_think").length;
    det.innerHTML = "<summary><span class='turn-badge'>Turn " + (i + 1) + "</span>" +
      "<span class='turn-count'>" + toolCount + " 个工具调用</span></summary>";
    const body = document.createElement("div");
    body.className = "turn-body";
    if (t.user) {
      const u = document.createElement("div");
      u.className = "turn-user";
      u.textContent = t.user;
      body.appendChild(u);
    }
    (t.steps || []).forEach(st => {
      if (st.tool === "_think") {
        const th = document.createElement("div");
        th.className = "think";
        th.textContent = "│ " + st.args;
        body.appendChild(th);
        return;
      }
      const sd = document.createElement("details");
      sd.className = "tool-details";
      const mark = st.success ? '<span class="ok">✓</span>' : '<span class="fail">✗</span>';
      sd.innerHTML = "<summary>" + mark + " <span class='tool-name'>" + escHtml(st.tool) + "</span></summary>";
      const sb = document.createElement("div");
      sb.className = "body";
      const argsTxt = parseArgs(st.args);
      if (argsTxt) {
        const al = document.createElement("div");
        al.className = "arg-label";
        al.textContent = "参数";
        sb.appendChild(al);
        sb.appendChild(document.createTextNode(argsTxt));
      }
      if (st.result != null) {
        const rl = document.createElement("div");
        rl.className = st.success ? "res-label" : "err-label";
        rl.textContent = st.success ? "结果" : "错误";
        sb.appendChild(rl);
        const rtxt = String(st.result);
        sb.appendChild(document.createTextNode(rtxt.length > 2000 ? rtxt.slice(0, 2000) + "\n…[截断]" : rtxt));
      }
      sd.appendChild(sb);
      body.appendChild(sd);
    });
    if (t.answer) {
      const a = document.createElement("div");
      a.className = "turn-answer";
      a.appendChild(renderMarkdown(t.answer));
      body.appendChild(a);
    }
    det.appendChild(body);
    feed.appendChild(det);
  });
  scrollFeed(true);
}
function closeHistory() {
  AppState.viewingHistory = false;
  AppState.currentSessionFile = null;
  AppState.sessionData = null;
  document.getElementById("historyBar").style.display = "none";
  document.querySelectorAll(".session-item").forEach(el => el.classList.remove("active"));
  feed.innerHTML = "";
  renderWelcome();
  add("turn", "已返回实时视图——运行新任务开始新的对话");
}
function downloadSession() {
  const d = AppState.sessionData;
  if (!d) return;
  const lines = ["Coder-Agent 会话导出", "任务: " + (d.task || ""), "=".repeat(40), ""];
  (d.turns || []).forEach((t, i) => {
    lines.push("【Turn " + (i + 1) + "】");
    if (t.user) lines.push("用户: " + t.user);
    (t.steps || []).forEach(st => {
      if (st.tool === "_think") { lines.push("  思考: " + st.args); return; }
      lines.push("  [" + (st.success ? "✓" : "✗") + "] " + st.tool + " " + (st.args || ""));
      if (st.result != null) lines.push("      → " + String(st.result).slice(0, 400));
    });
    if (t.answer) lines.push("回答: " + t.answer);
    lines.push("");
  });
  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "coder_session_" + Date.now() + ".txt";
  a.click();
  URL.revokeObjectURL(a.href);
}

function sessionProject(ws) {
  if (!ws) return "未分类";
  const parts = ws.replace(/[\\/]+$/, "").split(/[\\/]/);
  return parts[parts.length - 1] || ws;
}
async function loadSessions() {
  const resp = await fetch("/api/sessions");
  const data = await resp.json();
  const sessions = data.sessions || [];
  AppState.sessionCount = sessions.length;
  const box = document.getElementById("sessions");
  box.innerHTML = "";
  if (!sessions.length) {
    box.innerHTML = '<div style="font-size:11px;color:var(--faint);padding:8px;">暂无会话</div>';
    return;
  }
  // 按项目分组
  const groups = {};
  sessions.forEach(s => {
    const proj = sessionProject(s.workspace);
    (groups[proj] = groups[proj] || []).push(s);
  });
  // 当前工作区优先置顶
  let curWs = "";
  try { curWs = (await (await fetch("/api/workspace")).json()).workspace; } catch (e) {}
  const curProj = sessionProject(curWs);
  const projOrder = Object.keys(groups).sort((a, b) => {
    if (a === curProj) return -1;
    if (b === curProj) return 1;
    return 0;
  });
  projOrder.forEach(proj => {
    const gh = document.createElement("div");
    gh.style.cssText = "font-size:11px;color:var(--accent);margin:10px 2px 4px;font-weight:600;";
    gh.textContent = "📁 " + proj + (proj === curProj ? "（当前）" : "") +
      " · " + groups[proj].length + " 个会话";
    box.appendChild(gh);
    groups[proj].forEach(s => {
      const div = document.createElement("div");
      div.className = "session-item";
      div.dataset.file = s.file;
      if (s.file === AppState.currentSessionFile) div.classList.add("active");
      const time = s.file.split(/[\\/]/).pop().replace(/\.jsonl$/, "").replace(/^session_/, "");
      div.innerHTML = escHtml(s.task || "无标题") +
        '<div class="session-meta"><span>🗂 ' + escHtml(time) + '</span></div>' +
        '<button class="session-del" title="删除会话">🗑</button>';
      div.querySelector(".session-del").onclick = async (e) => {
        e.stopPropagation();
        if (!confirm("删除该会话？")) return;
        const r = await fetch("/api/session?file=" + encodeURIComponent(s.file), { method: "DELETE" });
        if (r.ok) {
          if (AppState.currentSessionFile === s.file) closeHistory();
          loadSessions();
        }
      };
      div.onclick = () => openSession(s.file);
      box.appendChild(div);
    });
  });
}

/* 文件树：懒加载展开（目录 ▶ 点击展开/折叠子层） */
let treePathCache = new Set();
async function loadFiles(dir, container, depth) {
  const rootContainer = container || document.getElementById("filetree");
  if (!container) {
    treePathCache.clear();
    rootContainer.dataset.loaded = "1";
    rootContainer.innerHTML = '<div style="color:var(--faint);font-size:11px;padding:8px;">加载中…</div>';
  }
  const ws = (await (await fetch("/api/workspace")).json()).workspace;
  const target = dir || ws;
  const data = await (await fetch("/api/fs/browse?path=" + encodeURIComponent(target))).json();
  const fl = await (await fetch("/api/files?path=" + encodeURIComponent(target))).json();
  if (!container) rootContainer.innerHTML = "";
  const d = depth || 0;
  const pad = 8 + d * 14;
  if (data.parent !== null && !data.drives && d === 0) {
    const up = document.createElement("div");
    up.className = "file-item";
    up.textContent = "↰ ..";
    up.style.paddingLeft = pad + "px";
    up.onclick = () => loadFiles(data.parent, rootContainer, 0);
    rootContainer.appendChild(up);
  }
  data.dirs.forEach(di => {
    const row = document.createElement("div");
    row.style.paddingLeft = pad + "px";
    row.className = "folder-item";
    row.style.display = "flex";
    row.style.alignItems = "center";
    row.style.gap = "6px";
    const arrow = document.createElement("span");
    arrow.textContent = "▸";
    arrow.style.cssText = "font-size:9px;color:var(--faint);transition:transform .15s;width:12px;";
    row.appendChild(arrow);
    const label = document.createElement("span");
    label.textContent = "📁 " + di.split(/[\\/]/).pop();
    label.style.flex = "1";
    label.style.overflow = "hidden";
    label.style.textOverflow = "ellipsis";
    label.style.whiteSpace = "nowrap";
    row.appendChild(label);
    let expanded = false, subContainer = null;
    row.onclick = async () => {
      if (!expanded) {
        arrow.textContent = "▾";
        subContainer = document.createElement("div");
        subContainer.style.marginLeft = "10px";
        row.parentNode.insertBefore(subContainer, row.nextSibling);
        await loadFiles(di, subContainer, d + 1);
        expanded = true;
      } else {
        arrow.textContent = "▸";
        if (subContainer) { subContainer.remove(); subContainer = null; }
        expanded = false;
      }
    };
    rootContainer.appendChild(row);
  });
  fl.files.slice(0, 50).forEach(f => {
    const b = document.createElement("div");
    b.className = "file-item";
    b.style.paddingLeft = pad + "px";
    b.textContent = "📄 " + f;
    b.onclick = () => viewFile(target + "\\" + f);
    rootContainer.appendChild(b);
  });
  if (fl.files.length > 50) {
    const more = document.createElement("div");
    more.style.cssText = "font-size:11px;color:var(--faint);padding:8px;";
    more.textContent = "... 还有 " + (fl.files.length - 50) + " 个文件";
    rootContainer.appendChild(more);
  }
}

  const d = await r.json();

function cmdStatus(c) {

  switch (c.name) {
    case "/model":
      return document.getElementById("model").value || "?";

        ? "🎯 " + (AppState.sessionGoal.length > 16 ? AppState.sessionGoal.slice(0, 16) + "…" : AppState.sessionGoal)
        : "未设置";

      return Stats.steps ? "已记录 " + Stats.steps + " 步" : "—";
    case "/history":
      return Stats.steps ? "最近 10 条" : "—";

      return Stats.steps ? "可查看" : "—";
    default:

function renderPalette(items) {
  palItems = items;
  palIndex = items.length ? 0 : -1;
  paletteEl.innerHTML = "";
  if (!items.length) {
    paletteEl.innerHTML = '<div class="empty">没有匹配的命令</div>';
  } else {
    paletteEl.innerHTML = '<div class="group-label">命令</div>';
    items.forEach((c, i) => {
      const div = document.createElement("div");
      div.className = "item" + (i === palIndex ? " active" : "");
      const st = cmdStatus(c);
      div.innerHTML = '<span class="name">' + escHtml(c.name) + '</span>' +
        '<span class="desc">' + escHtml(c.desc) + '</span>' +
        (st ? '<span class="stat">' + escHtml(st) + '</span>' : '') +
        (c.hasArgs ? '<span class="kbd">参数</span>' : '<span class="kbd">⏎</span>');
      div.onclick = () => pickPalette(c);
      paletteEl.appendChild(div);
    });
  }
  paletteEl.style.display = "block";
}
function hidePalette() { paletteEl.style.display = "none"; palItems = []; palIndex = -1; }
function movePalette(dir) {
  if (!palItems.length) return;
  palIndex = (palIndex + dir + palItems.length) % palItems.length;
  [...paletteEl.querySelectorAll(".item")].forEach((el, i) => el.classList.toggle("active", i === palIndex));
}
function pickPalette(c) {
  if (c.hasArgs) {
    inputEl.value = c.name + " ";
    hidePalette();
    showParamHint("用法: " + c.desc + "（输入参数后按 Enter 执行）");
    inputEl.focus();
  } else {
    inputEl.value = c.name;
    hidePalette();
    execLine(c.name);
    inputEl.value = "";
    inputEl.style.height = "auto";
  }
}
function currentCommand() {
  const v = inputEl.value;
  if (!v.startsWith("/")) return null;
  const token = v.split(/\s+/)[0];
  return AppState.commands.find(c => c.name === token) || null;
}
function updatePalette() {
  const v = inputEl.value;
  if (AppState.running || !v.startsWith("/")) { hidePalette(); hideParamHint(); return; }
  const token = v.split(/\s+/)[0];
  renderPalette(AppState.commands.filter(c => c.name.startsWith(token)));
  const cmd = AppState.commands.find(c => c.name === token);
  if (cmd && cmd.hasArgs && v.trim() === cmd.name) {
    showParamHint("用法: " + cmd.name + " " + (cmd.argHint || "<参数>") + "（Tab 继续输入，Enter 执行）");
  } else if (!v.includes(" ")) {
    hideParamHint();
  }
}

/* ═══════════ 输入事件 ═══════════ */
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  updatePalette();
});
inputEl.addEventListener("keydown", (e) => {
  const paletteOpen = paletteEl.style.display === "block";
  if (e.key === "Escape") {
    if (paletteOpen) { hidePalette(); hideParamHint(); e.preventDefault(); return; }
    if (AppState.running) { abort(); e.preventDefault(); }
    return;
  }
  if (paletteOpen && e.key === "ArrowDown") { movePalette(1); e.preventDefault(); return; }
  if (paletteOpen && e.key === "ArrowUp") { movePalette(-1); e.preventDefault(); return; }
  if (paletteOpen && e.key === "Tab") {
    if (palItems[palIndex]) {
      inputEl.value = palItems[palIndex].name + (palItems[palIndex].hasArgs ? " " : "");
      updatePalette();
    }
    e.preventDefault();
    return;
  }
  if (e.key === "Enter") {
    if (e.shiftKey) {
      e.preventDefault();
      inputEl.value += "\n";
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
      return;
    }
    e.preventDefault();
    const v = inputEl.value.trim();
    if (!v) return;
    if (v.startsWith("/")) {
      const cmd = currentCommand();
      const isComplete = cmd && (v === cmd.name || v.startsWith(cmd.name + " "));
      if (paletteOpen && palItems[palIndex] && !isComplete) {
        pickPalette(palItems[palIndex]);
        return;
      }
      hidePalette();
      hideParamHint();
      execLine(v);
      inputEl.value = "";
      inputEl.style.height = "auto";
      return;
    }
    hidePalette();
    hideParamHint();
    submitTask(v);
  }
});

/* ═══════════ 全局快捷键 ═══════════ */
document.addEventListener("keydown", (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === "enter") { e.preventDefault(); handleSubmit(); }
  else if (k === "k") { e.preventDefault(); feed.innerHTML = ""; AppState.currentTurnEl = null; renderWelcome(); }
  else if (k === "l") { e.preventDefault(); toggleTheme(); }
  else if (k === "o") { e.preventDefault(); openFolderDialog(); }
  else if (k === ",") { e.preventDefault(); openConfigModal(); }
  else if (k === "b") { e.preventDefault(); toggleActivity(); }
});

/* ═══════════ 命令执行 ═══════════ */
async function execLine(line) {
  const parts = line.split(/\s+/);
  const cmd = parts[0], arg = parts.slice(1).join(" ");
  if (cmd === "/help") {
    const card = add("answer", "");
    const groups = [
      ["📖 基本信息", ["/help", "/status", "/tools"]],
      ["🚀 运行控制", ["/model", "/mode", "/goal"]],
      ["🗂 会话管理", ["/sessions", "/resume"]],
      ["🧠 上下文与追踪", ["/compact", "/history", "/trace", "/clear"]],
    ];
    let html = "<b>命令帮助</b>（右侧为当前状态）<br><br>";
    groups.forEach(([gname, names]) => {
      html += "<b>" + gname + "</b><br>";
      AppState.commands.filter(c => names.includes(c.name)).forEach(c => {
        html += "  <span style='color:var(--accent);font-family:Consolas,monospace;'>" + c.name + "</span>" +
          (c.argHint ? " <span style='color:var(--muted);'>" + escHtml(c.argHint) + "</span>" : "") +
          "<br>      " + escHtml(c.desc) + (cmdStatus(c) ? "  <span style='color:var(--faint);'>[" + escHtml(cmdStatus(c)) + "]</span>" : "") + "<br>";
      });
      html += "<br>";
    });
    card.innerHTML = html;
    card.style.whiteSpace = "pre-wrap";
  } else if (cmd === "/status") {
    const s = await (await fetch("/api/status")).json();
    add("answer", "运行中: " + s.running + " | 模型: " + s.model +
      " | 模式: " + s.mode + "\n工作区: " + s.workspace +
      (AppState.sessionGoal ? "\n会话目标: " + AppState.sessionGoal : ""));
  } else if (cmd === "/tools") {
    const d = await (await fetch("/api/tools")).json();
    const card = add("answer", "");
    card.innerHTML = "<b>可用工具 (" + d.tools.length + ")</b><br>" +
      d.tools.map(t => "  " + t.name + " — " + t.description.substring(0, 60) + "...").join("<br>");
    card.style.whiteSpace = "pre-wrap";
  } else if (cmd === "/model") {
    if (!arg) {
      await loadModels();
      if (AppState.models.length) {
        const cur = document.getElementById("model").value;
        if (!AppState.models.includes(cur)) document.getElementById("model").value = AppState.models[0];
        add("answer", "在线模型:\n" + AppState.models.map(m =>
          (m === document.getElementById("model").value ? "  ← " : "  ") + m).join("\n"));
      } else add("error", "在线模型列表不可用");
    } else {
      document.getElementById("model").value = arg;
      saveModelOnly(arg);
      add("answer", "模型已切换: " + arg + "（下次运行生效）");
    }
  } else if (cmd === "/mode") {
    if (["full", "goal", "plan", "dry-run"].includes(arg)) {
      document.getElementById("mode").value = arg;
      add("answer", "模式已切换: " + arg);
    } else add("answer", "当前模式: " + document.getElementById("mode").value +
      "（用法: /mode full|goal|plan|dry-run）");
  } else if (cmd === "/goal") {
    if (arg === "clear") {
      AppState.sessionGoal = "";
      localStorage.removeItem('coder_goal');
      updateGoalBadge();
      add("answer", "会话目标已清除");
    } else if (arg) {
      AppState.sessionGoal = arg;
      localStorage.setItem('coder_goal', arg);
      updateGoalBadge();
      add("answer", "会话目标已设置: " + arg + "\n将随每次运行注入系统提示（Goal 字段）");
    } else add("answer", AppState.sessionGoal ? "当前会话目标: " + AppState.sessionGoal : "未设置（用法: /goal <text>）");
  } else if (cmd === "/sessions") {
    const d = await (await fetch("/api/sessions")).json();
    const card = add("answer", "");
    card.innerHTML = d.sessions.length
      ? "<b>会话列表（点击侧边栏查看详情）:</b><br>" + d.sessions.map((s, i) => (i + 1) + ". " + (s.task || "无标题")).join("<br>")
      : "没有会话——先运行一次任务";
    card.style.whiteSpace = "pre-wrap";
  } else if (cmd === "/resume") {
    if (AppState.running) {
      add("error", "当前有任务在运行，请先停止");
      return;
    }
    setRunning(true);
    const resp = await fetch("/api/resume", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task: arg || "继续之前的任务", goal: AppState.sessionGoal, resume: "" })
    });
    if (!resp.ok) {
      add("error", (await resp.json().catch(() => ({}))).detail || "恢复失败");
      setRunning(false);
      return;
    }
    listenEvents();
  } else if (cmd === "/compact") {
    const resp = await fetch("/api/compact", { method: "POST" });
    const d = await resp.json().catch(() => ({}));
    if (resp.ok) {
      add("answer", "✅ 上下文已压缩: " + d.before + " → " + d.after + " 条消息" +
        "\n（下次 /resume 恢复时使用压缩后的历史）");
    } else {
      add("error", d.detail || "压缩失败");
    }
  } else if (cmd === "/history") {
    const d = await (await fetch("/api/context")).json();
    const msgs = d.messages || [];
    const card = add("answer", "");
    if (d.running) card.innerHTML = "<b>（运行中，显示最近消息）</b><br>";
    card.innerHTML += msgs.length
      ? msgs.map(m => "<span style='color:" +
          (m.role === "user" ? "var(--accent)" : m.role === "tool" ? "var(--ok)" : "var(--muted)") +
          "'>[" + escHtml(m.role) + "]</span> " + escHtml(m.content)).join("<br>")
      : "没有历史消息——先运行一次任务";
    card.style.whiteSpace = "pre-wrap";
  } else if (cmd === "/trace") {
    const d = await (await fetch("/api/trace")).json();
    const entries = d.entries || [];
    const card = add("answer", "");
    card.innerHTML = entries.length
      ? "<b>最近一次运行的工具追踪 (" + entries.length + " 条):</b><br>" +
        entries.map(e => {
          const t = e.tool || e.name || "?";
          return "  step " + (e.step || e.turn || "?") + "  " + escHtml(t);
        }).join("<br>")
      : "没有追踪数据——先运行一次任务";
    card.style.whiteSpace = "pre-wrap";
  } else if (cmd === "/clear") {
    feed.innerHTML = "";
    AppState.currentTurnEl = null;
    renderWelcome();
  } else {
    add("error", "未知命令: " + cmd + "（/help 查看命令列表）");
  }
}

/* ═══════════ 初始化 ═══════════ */
async function init() {
  // 主题
  const saved = localStorage.getItem('coder_theme');
  applyTheme(saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
  await Promise.all([
    loadSessions(),
    loadWorkspace(),
    loadCommands(),
    loadModels(),
  ]);
  try {
    const cfg = await (await fetch("/api/config")).json();
    document.getElementById("model").value = cfg.model || document.getElementById("model").value;
  } catch (e) {}
  updateGoalBadge();
  renderWelcome();
}
init();
</script>
